<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPGA-IC Note</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">

<style>
*{box-sizing:border-box}
html,body{height:100%;}
body{
  margin:0;
  height:100vh;
  display:flex;
  font-family:"Microsoft YaHei", Arial, sans-serif;
  background:#e8d6b3;
}

/* 容器：三列布局 */
body > #app {
  display:flex;
  flex:1;
  min-width:0; /* 让子项可缩小 */
  position:relative; /* 让展开按钮绝对定位 */
}

/* ==================== 左侧 文件结构 ==================== */
#sidebar{
  width:260px;
  min-width:40px;
  overflow:visible; /* keep inner scroll visible */
  padding:15px;
  background:#f3e4c7;
  border-right:1px solid #d2b48c;
  color:#000;
  order:1;
  transition:width .22s ease, padding .18s ease;
}
#sidebar .inner{overflow:auto; max-height:calc(100vh - 64px); padding-right:8px}
#sidebar.collapsed{
  width:0;
  padding:0;
  border-right:none;
}
#sidebar h3{display:flex;align-items:center;justify-content:space-between;margin:0}
#sidebar h3 .toggle-btn{cursor:pointer;padding:4px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:transparent;border:1px solid transparent}
#sidebar h3 .toggle-btn:focus{outline:2px solid rgba(0,0,0,0.12)}
#sidebar h3 .toggle-btn svg{width:14px;height:14px;transform-origin:center;transition:transform .18s}

.file-item{padding:7px 8px;margin:3px 0;border-radius:5px;cursor:pointer;transition:0.15s}
.file-item:hover{background:#dfc69a;color:#000}
.file-item.active{background:#c28b45;color:#000}

/* ==================== 中间 文章目录 ==================== */
#toc{
  width:240px;
  min-width:40px;
  overflow:visible;
  padding:15px;
  background:#f3e4c7;
  border-right:1px solid #d2b48c;
  color:#000;
  order:2;
  transition:width .22s ease, padding .18s ease;
}
#toc .inner{overflow:auto; max-height:calc(100vh - 64px); padding-right:8px}
#toc.collapsed{width:0;padding:0;border-right:none}
#toc h3{display:flex;align-items:center;justify-content:space-between;margin:0}
#toc h3 .toggle-btn{cursor:pointer;padding:4px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:transparent;border:1px solid transparent}
#toc h3 .toggle-btn:focus{outline:2px solid rgba(0,0,0,0.12)}
#toc h3 .toggle-btn svg{width:14px;height:14px;transform-origin:center;transition:transform .18s}

#toc a{display:block;margin:7px 0;color:#000;text-decoration:none}
#toc a:hover{color:#8b4513}
.toc-h2{padding-left:15px}
.toc-h3{padding-left:30px;font-size:13px}

/* ==================== 右侧 Markdown正文 ==================== */
#content{
  flex:1;
  min-width:0; /* 重要：让内容在缩小时能滚动 */
  overflow:auto;
  padding:35px;
  background:#2b2118;
  order:3;
}

/* 覆盖github markdown默认 */
.markdown-body{
  /* 取消最大宽度，使用容器宽度 */
  max-width:none;
  width:100%;
  background:transparent!important;
  color:#000; /* 正文文字为黑色（按要求） */
}
.markdown-body h1,.markdown-body h2,.markdown-body h3{color:#000}
.markdown-body p,.markdown-body li{color:#000}
.markdown-body a{color:#000}
.markdown-body img{max-width:100%}

/* 表格样式：浅色背景，文字与正文一致，横竖分割为深色边线 */
.markdown-body table{
  background:#f5f5f5;
  border:1px solid #9e9e9e; /* 深色边线 */
  border-collapse:collapse;
  color:#000;
  width:100%;
}
.markdown-body table thead th{background:#f0f0f0}
.markdown-body table th,.markdown-body table td{
  border:1px solid #9e9e9e; /* 深色分割线 */
  padding:8px;
  background:#f5f5f5 !important; /* 强制浅底 */
  color:inherit;
}
/* 可选：交替行色，仍保持浅色系列 */
.markdown-body table tbody tr:nth-child(even) td{background:#fafafa !important}
.markdown-body table tbody tr:nth-child(odd) td{background:#f5f5f5 !important}

/* 代码块：改成浅色背景并与正文文字保持一致 */
.markdown-body pre{
  background:#f5f5f5 !important; /* 浅色背景 */
  color:#000 !important; /* 与正文一致 */
  border:1px solid #e0e0e0;
  border-radius:6px;
  padding:12px 14px;
  overflow:auto;
}
.markdown-body pre code{background:transparent !important;color:inherit !important}
.markdown-body code{background:#f0f0f0;padding:2px 6px;border-radius:4px;color:inherit}
/* 保持高亮但文字为正文颜色 */
.markdown-body pre .hljs{background:transparent !important;color:inherit !important}

/* 展开按钮（收起时显示，竖线样式） */
.expand-btn{
  position:absolute;
  top:56px;
  width:28px;height:60px;border-radius:4px;background:#f3e4c7;color:#000;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:50;border-left:2px solid #9e9e9e;
}
.expand-btn:focus{outline:2px solid rgba(0,0,0,0.12)}

/* 按钮旋转样式 */
.collapsed .toggle-btn svg.rotate-180{transform:rotate(180deg)}

/* 手机适配 */
@media(max-width:900px){
  #sidebar{width:170px}
  #toc{display:none}
  #content{padding:15px}
}
</style>
</head>

<body>
<div id="app">
  <!-- 文件结构 -->
  <div id="sidebar">
    <h3>
      <span>📚 FPGA-IC Note</span>
      <button class="toggle-btn" id="toggle-sidebar" aria-label="切换文件结构" title="切换文件结构" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </h3>
    <div class="inner" id="filelist">加载中...</div>
  </div>

  <!-- 文章目录 -->
  <div id="toc">
    <h3>
      <span>📑 目录</span>
      <button class="toggle-btn" id="toggle-toc" aria-label="切换目录" title="切换目录" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </h3>
    <div class="inner" id="toc-list"></div>
  </div>

  <!-- 正文 -->
  <div id="content" class="markdown-body">加载中...</div>

  <!-- 展开按钮（当栏被收起时显示） -->
  <button id="expand-sidebar" class="expand-btn" aria-hidden="true" title="展开文件结构">▶</button>
  <button id="expand-toc" class="expand-btn" aria-hidden="true" title="展开目录">▶</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script>
const USER="txofxxd";
const REPO="FPGA-IC_note";
const BRANCH="main";
const RAW_BASE=`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`;
const API_URL=`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
const filelist=document.getElementById("filelist");
const content=document.getElementById("content");
const toc=document.getElementById("toc-list");

const expandSidebarBtn = document.getElementById('expand-sidebar');
const expandTocBtn = document.getElementById('expand-toc');

// persist collapsed state only
function saveState(){
  try{
    const s=document.getElementById('sidebar');
    const t=document.getElementById('toc');
    localStorage.setItem('notes_reader_sidebar_collapsed', s.classList.contains('collapsed'));
    localStorage.setItem('notes_reader_toc_collapsed', t.classList.contains('collapsed'));
  }catch(e){console.warn(e)}
}
function loadState(){
  try{
    const s=document.getElementById('sidebar');
    const t=document.getElementById('toc');
    const sc = localStorage.getItem('notes_reader_sidebar_collapsed') === 'true';
    const tc = localStorage.getItem('notes_reader_toc_collapsed') === 'true';
    if(sc) setCollapsed('sidebar', true); else setCollapsed('sidebar', false);
    if(tc) setCollapsed('toc', true); else setCollapsed('toc', false);
  }catch(e){console.warn(e)}
}

// setCollapsed: when collapse true, hide inner and show expand button; when false restore
function setCollapsed(id, collapse){
  const el=document.getElementById(id);
  const inner=el.querySelector('.inner');
  const btn = document.getElementById(id==='sidebar'?'expand-sidebar':'expand-toc');
  const toggle = document.getElementById(id==='sidebar'?'toggle-sidebar':'toggle-toc');

  if(collapse){
    el.dataset.prevWidth = window.getComputedStyle(el).width;
    el.classList.add('collapsed');
    if(inner) inner.style.display='none';
    positionExpandButtons();
    btn.style.display='flex';
    btn.setAttribute('aria-hidden','false');
    toggle.querySelector('svg').classList.add('rotate-180');
  }else{
    el.classList.remove('collapsed');
    if(inner) inner.style.display='block';
    btn.style.display='none';
    btn.setAttribute('aria-hidden','true');
    toggle.querySelector('svg').classList.remove('rotate-180');
    positionExpandButtons();
  }
  saveState();
}

function toggleCollapse(id){
  const el=document.getElementById(id);
  setCollapsed(id, !el.classList.contains('collapsed'));
}

function makeToggleAccessible(btnId, targetId){
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', ()=> toggleCollapse(targetId));
  btn.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleCollapse(targetId); }
  });
}
makeToggleAccessible('toggle-sidebar','sidebar');
makeToggleAccessible('toggle-toc','toc');

expandSidebarBtn.addEventListener('click', ()=> setCollapsed('sidebar', false));
expandTocBtn.addEventListener('click', ()=> setCollapsed('toc', false));
expandSidebarBtn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); setCollapsed('sidebar', false); } });
expandTocBtn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); setCollapsed('toc', false); } });

// position expand buttons so they don't overlap; keep small offset when multiple collapsed
function positionExpandButtons(){
  const app = document.getElementById('app');
  const sidebar = document.getElementById('sidebar');
  const tocEl = document.getElementById('toc');
  const appRect = app.getBoundingClientRect();
  const sidebarWidth = sidebar.classList.contains('collapsed') ? 0 : sidebar.getBoundingClientRect().width;
  // base left positions inside app (relative to app's left)
  // sidebar button should be at very left (0)
  // toc button should be at sidebarWidth (if sidebar visible) or slightly right if sidebar collapsed to avoid overlap
  let sidebarLeft = 0; // always 0
  let tocLeft = sidebarWidth;
  // if sidebar is collapsed, push toc button right by 36px to avoid overlap
  if(sidebar.classList.contains('collapsed')) tocLeft += 36;

  // set positions relative to app
  const sidebarBtn = document.getElementById('expand-sidebar');
  const tocBtn = document.getElementById('expand-toc');
  if(sidebar.classList.contains('collapsed')){
    sidebarBtn.style.left = sidebarLeft + 'px';
  }
  if(tocEl.classList.contains('collapsed')){
    tocBtn.style.left = tocLeft + 'px';
  }
}

// update expand button positions on resize/scroll
window.addEventListener('resize', ()=>{ positionExpandButtons(); });
window.addEventListener('scroll', ()=>{ positionExpandButtons(); });

// load repo files
marked.setOptions({
  highlight:function(code,lang){
    if(lang && hljs.getLanguage(lang)) return hljs.highlight(code,{language:lang}).value;
    return hljs.highlightAuto(code).value;
  }
});

fetch(API_URL).then(res=>res.json()).then(data=>{
  let files = [];
  if(data && data.tree) files = data.tree.filter(x=>x.path && x.path.endsWith('.md'));
  filelist.innerHTML='';
  files.forEach(file=>{
    let div=document.createElement('div');
    div.className='file-item';
    div.innerHTML='📄 '+file.path;
    div.onclick=function(){ loadMarkdown(file.path,div); };
    filelist.appendChild(div);
  });
  if(files.length>0) loadMarkdown('README.md');
}).catch(err=>{filelist.innerText='无法加载文件列表'});

function loadMarkdown(path,element){
  fetch(RAW_BASE+encodeURI(path)).then(res=>res.text()).then(md=>{
    md=fixImages(md);
    content.innerHTML=marked.parse(md);
    generateTOC();
    if(window.MathJax && MathJax.typeset) MathJax.typeset();
  }).catch(err=>{content.innerText='加载失败'});

  if(element){
    document.querySelectorAll('.file-item').forEach(x=>x.classList.remove('active'));
    element.classList.add('active');
  }
}

function fixImages(md){
  return md.replace(/!\[(.*?)\]\((?:\.\/)?media\/(.+?)\)/g,function(match,alt,path){
    return `![${alt}](${RAW_BASE}media/${encodeURIComponent(path)})`;
  });
}

function generateTOC(){
  toc.innerHTML='';
  let headers=content.querySelectorAll('h1,h2,h3');
  headers.forEach((h,index)=>{
    let id='heading-'+index; h.id=id;
    let a=document.createElement('a'); a.href='#'+id; a.innerText=h.innerText;
    if(h.tagName==='H2') a.className='toc-h2';
    if(h.tagName==='H3') a.className='toc-h3';
    toc.appendChild(a);
  });
}

// initialize collapse state from localStorage (and position buttons)
loadState();
positionExpandButtons();
</script>
</body>
</html>
