<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FPGA-IC Note</title>


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">



<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    height:100vh;

    display:flex;

    font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

    background:#e8d6b3;

}




/* ====================
   左侧 文件结构
==================== */


#sidebar{


    width:260px;

    overflow:auto;

    padding:15px;


    background:#f3e4c7;


    border-right:
    1px solid #d2b48c;


    color:#4a3828;

}



#sidebar h3{

    margin-top:0;

}



.file-item{


    padding:7px 8px;


    margin:3px 0;


    border-radius:5px;


    cursor:pointer;


    transition:0.15s;


}



.file-item:hover{


    background:#dfc69a;


    color:#000;


}



.file-item.active{


    background:#c28b45;


    color:white;


}




/* ====================
   中间 文章目录
==================== */


#toc{


    width:240px;


    overflow:auto;


    padding:15px;


    background:#f3e4c7;


    border-right:
    1px solid #d2b48c;


    color:#4a3828;


}



#toc h3{

    margin-top:0;

}



#toc a{


    display:block;


    margin:7px 0;


    color:#59402a;


    text-decoration:none;


}



#toc a:hover{


    color:#8b4513;


}



.toc-h2{

    padding-left:15px;

}



.toc-h3{

    padding-left:30px;

    font-size:13px;

}





/* ====================
   右侧 Markdown正文
==================== */


#content{


    flex:1;


    overflow:auto;


    padding:35px;


    background:#2b2118;


}



/* 覆盖github markdown默认 */

.markdown-body{


    max-width:950px;


    background:transparent!important;


    color:#e8dcc8;


}



.markdown-body h1,
.markdown-body h2,
.markdown-body h3{


    color:#ffe7bd;


}



.markdown-body p,
.markdown-body li{


    color:#e8dcc8;


}



.markdown-body a{


    color:#d9a066;


}



.markdown-body img{


    max-width:100%;


}



.markdown-body pre{


    background:#17120e;


    border-radius:8px;


    padding:15px;


}



.markdown-body code{


    color:#ffd28a;


}



/* 手机适配 */

@media(max-width:900px){


    #sidebar{

        width:170px;

    }


    #toc{

        display:none;

    }


    #content{

        padding:15px;

    }

}



</style>


</head>





<body>




<!-- 文件结构 -->


<div id="sidebar">


<h3>
📚 FPGA-IC Note
</h3>


<div id="filelist">

加载中...

</div>


</div>





<!-- 正文 -->


<div id="content"
class="markdown-body">


加载中...


</div>





<!-- 文章目录 -->


<div id="toc">


<h3>
📑 目录
</h3>


<div id="toc-list">

</div>


</div>







<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>





<script>


//=========================
// GitHub仓库
//=========================


const USER="txofxxd";


const REPO="FPGA-IC_note";


const BRANCH="main";



const RAW_BASE=
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`;



const API_URL=
`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`;





const filelist=
document.getElementById("filelist");


const content=
document.getElementById("content");


const toc=
document.getElementById("toc-list");



let currentFile=null;





//=========================
// markdown解析
//=========================


marked.setOptions({

highlight:function(code,lang){


if(lang && hljs.getLanguage(lang)){


return hljs.highlight(code,
{
language:lang
}).value;


}


return hljs.highlightAuto(code).value;


}


});








//=========================
// 获取md文件
//=========================


fetch(API_URL)


.then(res=>res.json())


.then(data=>{


let files=
data.tree.filter(

x=>x.path.endsWith(".md")

);



filelist.innerHTML="";



files.forEach(file=>{


let div=
document.createElement("div");



div.className="file-item";



div.innerHTML=
"📄 "+file.path;



div.onclick=function(){


loadMarkdown(file.path,div);


};



filelist.appendChild(div);



});



loadMarkdown("README.md");


});








//=========================
// 加载文章
//=========================


function loadMarkdown(path,element){


fetch(
RAW_BASE+encodeURI(path)
)


.then(res=>res.text())


.then(md=>{


md=fixImages(md);



content.innerHTML=
marked.parse(md);



generateTOC();



MathJax.typeset();



});



if(element){


document.querySelectorAll(".file-item")
.forEach(
x=>x.classList.remove("active")
);



element.classList.add("active");


}


}









//=========================
// 图片路径转换
//=========================


function fixImages(md){



return md.replace(

/!\[(.*?)\]\((?:\.\/)?media\/(.+?)\)/g,


function(match,alt,path){


return `![${alt}](${RAW_BASE}media/${encodeURIComponent(path)})`;


}


);



}









//=========================
// 生成目录
//=========================


function generateTOC(){


toc.innerHTML="";


let headers=
content.querySelectorAll(
"h1,h2,h3"
);



headers.forEach((h,index)=>{


let id=
"heading-"+index;



h.id=id;



let a=
document.createElement("a");



a.href="#"+id;


a.innerText=
h.innerText;



if(h.tagName==="H2"){

a.className="toc-h2";

}


if(h.tagName==="H3"){

a.className="toc-h3";

}



toc.appendChild(a);



});



}



</script>



</body>

</html>
